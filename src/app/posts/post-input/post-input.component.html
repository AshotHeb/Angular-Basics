<div class="post-input">
  <input
    type="text"
    placeholder="Title"
    class="input"
    [(ngModel)]="title"
    #postTitleInput
  />
  <input
    type="text"
    placeholder="Content"
    class="input"
    [(ngModel)]="content"
  />
  <button class="button" (click)="addPost()">Add Post</button>
  <button class="button" (click)="onFocusPostTitleInput()">
    Focus On title
  </button>
</div>
